  asserted about and must be kept apart: (1) what the TOOL consumes and produces —
  it is one of the most widely deployed OpenAPI Specification implementations in
  existence — and (2) what the hosted Online Generator API itself conforms to,
  which is far less. Only the second column is what a consumer of
  api.openapi-generator.tech gets.
