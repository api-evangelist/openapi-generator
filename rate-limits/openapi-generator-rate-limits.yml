headers_note: >-
  A live GET https://api.openapi-generator.tech/api/gen/clients on 2026-08-06
  returned 200 with no RateLimit-Limit, RateLimit-Policy, X-RateLimit-*,
  Retry-After or equivalent header. Response headers were date, content-type,
  server (cloudflare), nel, vary, cf-cache-status, report-to, cf-ray, alt-svc.
responseCodes: {}
limits: []
plans_note: >-
  There are no tiers. The project is Apache-2.0 and free; there is no API key, no
  sign-up, and no paid plan for the hosted generator.
evidence:
  - {url: 'https://api.openapi-generator.tech/api/gen/clients', http_status: 200, rate_limit_headers: none, fetched: '2026-08-06'}
  - {url: 'https://openapi-generator.tech/docs/online', http_status: 200, documents_rate_limits: false, fetched: '2026-08-06'}
consumer_guidance: >-
  Because no limit is declared, none can be relied on. Any throttling in front of
  api.openapi-generator.tech is Cloudflare edge behaviour, undeclared to clients
  and subject to change without notice. Clients should back off on 429 or 5xx
  regardless, and anything that must be reliable should run the CLI, Docker image
  or build-tool plugin locally instead of calling the hosted service. See
  cli/openapi-generator-cli.yml.
