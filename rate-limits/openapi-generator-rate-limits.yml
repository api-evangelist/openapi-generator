description: >-
  OpenAPI Generator publishes no rate limits for its hosted Online Generator API,
  and the service signals none at runtime. This file previously carried scaffold
  defaults — free/professional/enterprise tiers with per-minute and per-month
  quotas keyed to an API key — that the provider has never published and that do
  not exist: the API has no API keys and no tiers. Those fabricated values were
  removed on 2026-08-06 and replaced with the probed result.
published: false
