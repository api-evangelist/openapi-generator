aid: openapi-generator
name: OpenAPI Generator
description: >-
  OpenAPI Generator is a community-governed, Apache-2.0 open-source project that
  generates client libraries (SDKs), server stubs, API documentation and
  configuration automatically from an OpenAPI Specification (v2 and v3). Forked
  from Swagger Codegen in 2018 by more than 40 of that project's top contributors
  and template creators, it is one of the most widely deployed implementations of
  the OpenAPI Specification in existence. The product is a CLI plus Maven, Gradle
  and sbt plugins, a Docker image and an embeddable JVM library, distributed
  through npm, PyPI, Maven Central, Homebrew, Scoop and Docker Hub. A hosted
  Online Generator REST API at api.openapi-generator.tech offers the same
  generation over HTTP, anonymously and without a key, across 84 client
  generators and 65 server frameworks.
